<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive Tableau story comparing fuel prices across the top three countries.">
  <title>Fuel Price Comparison | Meet Jain</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #65717e;
      --paper: #f5f7fa;
      --accent: #176b87;
      --line: #e2e8ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    header {
      padding: 28px 6vw 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
      letter-spacing: -.04em;
      line-height: 1.1;
    }
    .subtitle {
      max-width: 760px;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }
    main { max-width: 1320px; margin: 0 auto; padding: 28px 20px 48px; }
    .dashboard-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(23, 32, 42, .06);
    }
    .dashboard-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
    }
    .dashboard-heading h2 { margin: 0; font-size: 1rem; }
    .dashboard-heading a {
      color: var(--accent);
      font-size: .9rem;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }
    .dashboard-heading a:hover { text-decoration: underline; }
    .tableauPlaceholder { width: 100%; position: relative; }
    .tableauPlaceholder object { width: 100%; display: block; }
    footer {
      padding: 20px;
      color: var(--muted);
      text-align: center;
      font-size: .9rem;
    }
    footer strong { color: var(--ink); }
    @media (max-width: 600px) {
      header { padding: 24px 20px; }
      main { padding: 18px 12px 32px; }
      .dashboard-heading { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Data Story · Tableau</p>
    <h1>Fuel Price Comparison</h1>
    <p class="subtitle">
      Explore fuel price trends and compare the top three countries in this interactive Tableau story.
    </p>
  </header>

  <main>
    <section class="dashboard-card" aria-label="Interactive fuel price comparison">
      <div class="dashboard-heading">
        <h2>Top 3 Countries</h2>
        <a href="https://public.tableau.com/views/GlobalAverageFuelPricesTrend2020-2026Story_17934304566820/FuelPriceComparison-Top3Countriesstory" target="_blank" rel="noopener noreferrer">
          Open in Tableau ↗
        </a>
      </div>
      <div class="tableauPlaceholder" id="fuel-price-story">
        <noscript>
          <a href="https://public.tableau.com/">
            <img alt="Fuel Price Comparison - Top 3 Countries"
              src="https://public.tableau.com/static/images/Gl/GlobalAverageFuelPricesTrend2020-2026Story_17934304566820/FuelPriceComparison-Top3Countriesstory/1.png"
              style="width:100%; border:0;">
          </a>
        </noscript>
        <object class="tableauViz" style="display:none;">
          <param name="host_url" value="https%3A%2F%2Fpublic.tableau.com%2F">
          <param name="embed_code_version" value="3">
          <param name="site_root" value="">
          <param name="name" value="GlobalAverageFuelPricesTrend2020-2026Story_17934304566820/FuelPriceComparison-Top3Countriesstory">
          <param name="tabs" value="no">
          <param name="toolbar" value="yes">
          <param name="static_image" value="https://public.tableau.com/static/images/Gl/GlobalAverageFuelPricesTrend2020-2026Story_17934304566820/FuelPriceComparison-Top3Countriesstory/1.png">
          <param name="animate_transition" value="yes">
          <param name="display_static_image" value="yes">
          <param name="display_spinner" value="yes">
          <param name="display_overlay" value="yes">
          <param name="display_count" value="yes">
          <param name="language" value="en-US">
          <param name="filter" value="publish=yes">
        </object>
      </div>
    </section>
  </main>

  <footer>Created by <strong>Meet Jain</strong></footer>

  <script>
    const placeholder = document.getElementById("fuel-price-story");
    const viz = placeholder.querySelector("object");
    function resizeViz() {
      viz.style.width = "100%";
      viz.style.height = window.innerWidth < 700 ? "760px" : "950px";
    }
    resizeViz();
    window.addEventListener("resize", resizeViz);
    const script = document.createElement("script");
    script.src = "https://public.tableau.com/javascripts/api/viz_v1.js";
    script.async = true;
    viz.parentNode.insertBefore(script, viz);
  </script>
</body>
</html>
